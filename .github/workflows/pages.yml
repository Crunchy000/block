name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Everything that runs on the GPU (the world's ticks, flags, meshing and picking, and the
      # TF.js kernels) checked against the reference in headless Chromium (software Vulkan).
      # Reports SKIP if the runner can't provide a WebGPU adapter.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:gpu
      - run: npm run build
      - uses: actions/configure-pages@v5
        if: github.ref_name == github.event.repository.default_branch
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == github.event.repository.default_branch
        with:
          path: dist

  deploy:
    # Every push is built and tested; only the default branch is published.
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
