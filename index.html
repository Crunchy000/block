<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: ui-monospace, Menlo, Consolas, monospace; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #hud { position: fixed; top: 8px; left: 8px; color: #fff; font-size: 12px; line-height: 1.5; white-space: pre; text-shadow: 0 1px 2px #000; pointer-events: none; }
      #crosshair { position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; pointer-events: none; }
      #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; mix-blend-mode: difference; }
      #crosshair::before { left: 6px; top: 0; width: 2px; height: 14px; }
      #crosshair::after { top: 6px; left: 0; height: 2px; width: 14px; }
      #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; background: rgba(0,0,0,.55); text-align: center; font-size: 14px; line-height: 1.8; }
      #overlay.hidden { display: none; }
      #overlay h1 { font-size: 28px; margin: 0 0 12px; }
      #error { color: #ff8a80; }
    </style>
  </head>
  <body>
    <canvas id="gpu"></canvas>
    <div id="crosshair"></div>
    <div id="hud"></div>
    <div id="overlay">
      <div>
        <h1>Block</h1>
        <div id="status">Loading…</div>
        <div id="error"></div>
        <div>Click to play · WASD move · Space/Shift up/down · Ctrl sprint<br />
        Left click break · Right click place · 1 dirt · 2 stone · 3 water · 4 lava<br />
        G toggle chunk/ghost-halo outlines · P pause block updates</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
